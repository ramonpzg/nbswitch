[project]
name = "nbswitch"
version = "0.0.1"
description = "NbSwitch is a tool for modifying the use case of lessons inside jupyter notebooks, pure markdown, and other file formats."
authors = [
    {name = "Ramon Perez", email = "ramonpzg@protonmail.com"},
]
dependencies = [
    "anthropic>=0.33.1",
    "instructor>=1.3.7",
    "bs4>=0.0.2",
    "fastapi",
    "pydantic>=2.9.1",
    "nbconvert>=7.16.4",
    "nbformat>=5.10.4",
    "typer>=0.12.5",
    "rich>=13.8.1",
    "faker>=28.4.1",
    "litellm>=1.40.8",
    "count-tokens>=0.7.0",
    "groq>=0.9.0",
    "cohere>=5.8.0",
    "python-fasthtml>=0.3.4",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache 2.0"}

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5.28",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.scripts]
nbswitch = "nbswitch.cli:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.2",
    "ipython>=8.26.0",
    "ruff>=0.6.4",
]

